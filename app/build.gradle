plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.elcris.coservers'
    compileSdk 32
    //buildToolsVersion "33.0.0"

    defaultConfig {
        applicationId "com.elcris.coservers"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
    lintOptions {
        checkReleaseBuilds false
    }
	
	/**buildFeatures {
        viewBinding true
    }**/
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.7.0-alpha05'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'org.connectbot.jbcrypt:jbcrypt:1.0.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.24'
	implementation 'com.github.kimchangyoun:rootbeerFresh:0.0.10'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'com.github.Stjinchan:ExpandableCardView:1.2.2'
    implementation 'com.google.android.gms:play-services-ads-lite:20.4.0'
    implementation 'com.google.firebase:firebase-bom:31.2.0'
    implementation 'com.google.firebase:firebase-firestore:24.4.2'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.getbase:floatingactionbutton:1.10.1'
    implementation 'com.google.firebase:firebase-dynamic-links:21.1.0'



    //implementation 'androidx.appcompat:appcompat:1.5.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'


}
